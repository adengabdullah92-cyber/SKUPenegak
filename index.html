['catatan_pembina','sub_id',()=>subs.filter(x=>x.pn).map(x=>({sub_id:x.id,teks:x.pn})),r=>r.forEach(x=>{const s=subs.find(y=>y.id==x.sub_id);if(s)s.pn=x.teks})],
['garuda_tasks','id',()=>gt.map((t,i)=>({id:t.id,teks:t.t,urut:i})),r=>{gt=r.sort((a,b)=>a.urut-b.urut).map(x=>({id:x.id,t:x.teks,d:{}}))}],
['garuda_checks','k',()=>gt.flatMap(t=>Object.keys(t.d).map(u=>({k:t.id+'-'+U2(u),task_id:t.id,user_id:U2(u)}))),r=>r.forEach(x=>{const t=gt.find(y=>y.id==x.task_id);if(t)t.d[I2(x.user_id)]=1})],
['dev_logs','id',()=>devs.map(d=>({id:(d.id??=nid++),user_id:U2(d.u),judul:d.t,jenis:d.j,jam:d.h})),r=>{devs=r.map(x=>({id:x.id,u:I2(x.user_id),t:x.judul,j:x.jenis,h:x.jam}))}],
['feedback','id',()=>fbs.map(f=>({id:(f.id??=nid++),to_user:U2(f.to),from_name:f.from,teks:f.t})),r=>{fbs=r.map(x=>({id:x.id,to:I2(x.to_user),from:x.from_name,t:x.teks}))}]];
let prev={},busy=false,again=false,sv,ready=false;
async function loadAll(){for(const[t,k,rows,set]of TB){const{data,error}=await sb.from(t).select('*');if(error){toast('Gagal memuat '+t+': '+error.message);continue}set(data);prev[t]=bykey(rows(),k)}nid=Date.now()*10;if(me)me=users.find(x=>x.id==me.id)||me}
async function sync(){if(busy){again=true;return}busy=true;try{for(const[t,k,rows]of TB){const cur=rows(),m=bykey(cur,k),p=prev[t]||{},up=cur.filter(r=>p[r[k]]!==m[r[k]]),del=Object.keys(p).filter(x=>!(x in m));
if(up.length){const{error}=await sb.from(t).upsert(up);if(error)throw error}
if(del.length){const{error}=await sb.from(t).delete().in(k,del);if(error)throw error}prev[t]=m}}catch(e){toast('Perubahan ditolak atau gagal: '+e.message);await loadAll();render()}busy=false;if(again){again=false;sync()}}
function persist(){if(!sb||!ready||!me)return;clearTimeout(sv);sv=setTimeout(sync,400)}
const _draw=render;render=function(){_draw();persist()};
async function boot(){if(!sb)return;const{data:{session}}=await sb.auth.getSession();if(!session){me=null;ready=false;render();return}await loadAll();me=users.find(x=>x.id==session.user.id)||null;ready=!!me;render()}
doLogin=async(u,p)=>{if(!sb){toast('Isi SUPABASE_URL dan SUPABASE_KEY di bagian atas skrip.');return}u=String(u).trim();const{data:un}=await sb.rpc('username_for',{ident:u}),{error}=await sb.auth.signInWithPassword({email:(un||u.toLowerCase())+'@pramuka.id',password:p});if(error){toast('Username atau password salah.');return}await boot();if(me){location.hash='/';render();toast('Selamat datang, '+me.n)}};
acts.lo2=async()=>{await sb?.auth.signOut();me=null;ready=false;quiz=null;close();location.hash='/login';render();toast('Anda telah keluar.')};
acts.fin=async()=>{if(!quiz||quiz.res||quiz.busy)return;quiz.busy=1;clearInterval(tmr);const a={};quiz.items.forEach((it,i)=>{if(quiz.ans[i]!==undefined)a[it.k]=quiz.ans[i]});const{data,error}=await sb.rpc('submit_kuis',{p_sku:quiz.id,p_jawaban:a});if(error){quiz.busy=0;toast('Gagal menilai: '+error.message);return}quiz.res={sc:data.skor,b:data.benar,n:data.total,ok:data.lulus};if(data.lulus)await loadAll();render()};
acts.seed=()=>{({skus,Q,subs,gt,devs,fbs}=JSON.parse(JSON.stringify(DEF)));render();toast('Data awal dikirim ke Supabase.')};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState=='visible'&&ready&&!busy&&!$('#modal').classList.contains('on')&&!(quiz&&!quiz.res)){await loadAll();render()}});
addEventListener('hashchange',render);render();boot();
</script></body></html>
