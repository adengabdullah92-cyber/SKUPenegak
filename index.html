acts.vg=d=>d.o=='1'?rpc('verifikasi_calon_garuda',{p_user:d.id,p_setuju:true,p_catatan:null},'Calon Garuda diverifikasi.'):modal(`<h3>Kembalikan ke Penegak Laksana?</h3><label>Alasan</label><textarea id="vg_c" rows="2"></textarea><button class="btn red" data-act="vg2" data-id="${d.id}">Kembalikan</button>`);

/* Pendampingan mandiri */
let PD=[];const _la2=loadAll;loadAll=async function(){await _la2();const{data}=await fetchAll('pendampingan','mentee_id');PD=data||[]};
const MR=['b','cg','l','g'],mentOf=id=>PD.find(x=>x.mentee_id==id),mentees=id=>PD.filter(x=>x.mentor_id==id).map(x=>users.find(u=>u.id==x.mentee_id)).filter(Boolean),canM=(m,t)=>!!m.g&&m.g==t.g&&(m.r=='b'?t.r=='cb':['cg','l','g'].includes(m.r)&&['cb','b'].includes(t.r));
const fbl=u=>fbs.filter(f=>f.to==u.u).map(f=>`<p style="margin:4px 0"><small><b>${esc(f.from)}${f.tg?' · '+fd(f.tg):''}:</b> ${esc(f.t)}</small></p>`).join('');
const mcard=u=>{const[a,b]=prog(u);return`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(u.n)}</b><span class="bd mut">${ROLES[u.r]} · ${esc(u.k)}/${esc(u.s)}</span></div><p class="mut" style="margin:6px 0">SKU ${a}/${b} · ${subs.filter(x=>x.uid==u.u&&x.st=='pending').length} menunggu verifikasi</p><div class="pg"><i style="width:${b?a/b*100:0}%"></i></div>${fbl(u)}<div class="row" style="margin-top:8px"><input id="fb_${u.u}" placeholder="Tulis catatan / umpan balik..." style="flex:1;margin:0"><button class="btn sm pri" data-act="fb" data-u="${u.u}">Kirim</button><button class="btn sm red" data-act="lp" data-id="${u.id}">Lepas</button></div></div>`};
function monitor(){const prs=users.filter(u=>MR.includes(u.r)).map(m=>({m,l:mentees(m.id)})).filter(x=>x.l.length).sort((a,b)=>b.l.length-a.l.length),no=users.filter(u=>(u.r=='cb'||u.r=='b')&&!mentOf(u.id));
return`<h1>Pemantauan Pendampingan</h1><div class="g2" style="margin-bottom:12px"><div class="card" style="margin:0;text-align:center"><h1 style="margin:0">${prs.length}</h1><small class="mut">Pendamping aktif</small></div><div class="card" style="margin:0;text-align:center"><h1 style="margin:0">${PD.length}</h1><small class="mut">Anak dampingan</small></div><div class="card" style="margin:0;text-align:center"><h1 class="wait" style="margin:0">${no.length}</h1><small class="mut">Belum punya pendamping</small></div></div><div class="card tw"><table><tr><th>Pendamping</th><th>Anak dampingan</th><th>Catatan terakhir</th></tr>${prs.map(({m,l})=>{const ts=fbs.filter(f=>f.from==m.n&&f.tg&&l.some(u=>u.u==f.to)).map(f=>+new Date(f.tg));return`<tr><td>${esc(m.n)}<br><small class="mut">${ROLES[m.r]}</small></td><td>${l.map(u=>{const[a,b]=prog(u);return`<div>${esc(u.n)} <small class="mut">· ${ROLES[u.r]} · SKU ${a}/${b}</small>${u.g&&m.g?(u.g!=m.g?' <span class="bd bad">lintas JK</span>':''):' <span class="bd wait">JK belum diisi</span>'}${me.r=='ad'?` <button class="btn sm red" data-act="lp" data-id="${u.id}"><i data-lucide="x"></i></button>`:''}</div>`}).join('')}</td><td>${ts.length?fd(Math.max(...ts)):'-'}</td></tr>`}).join('')||'<tr><td colspan=3 class="mut">Belum ada pasangan pendampingan.</td></tr>'}</table></div>${no.length?`<div class="card"><h3>Belum punya pendamping (${no.length})</h3><small class="mut">${no.slice(0,40).map(u=>esc(u.n)).join(', ')}${no.length>40?', …':''}</small></div>`:''}`}
function mentor2(){if(me.r=='pm'||me.r=='ad')return monitor();let h='<h1>Pendampingan</h1>';
if(MR.includes(me.r)){const l=mentees(me.id);h+=`<div class="row" style="justify-content:space-between"><h2>Anak dampingan saya (${l.length}/5)</h2><button class="btn pri" data-act="am"><i data-lucide="plus"></i>Tambah anak dampingan</button></div><p class="mut"><small>${me.r=='b'?'Penegak Bantara mendampingi Calon Bantara.':'Anda dapat mendampingi Calon Bantara dan Penegak Bantara.'} Anda bisa menambah atau melepas kapan saja.</small></p>`+(l.map(mcard).join('')||'<p class="mut">Belum ada anak dampingan.</p>')}
if(me.r=='cb'||me.r=='b'){const m=mentOf(me.id),u=m&&users.find(x=>x.id==m.mentor_id);h+=`<h2 style="margin-top:20px">Pendamping saya</h2>`+(u?`<div class="card"><b>${esc(u.n)}</b> <span class="bd mut">${ROLES[u.r]} · ${esc(u.k)}/${esc(u.s)}</span>${fbl(me)||'<p class="mut"><small>Belum ada catatan dari pendamping.</small></p>'}</div>`:'<p class="mut">Belum ada pendamping. Penegak yang lebih senior dapat menambahkan Anda sebagai anak dampingan.</p>')}return h}
PAGES['/pendampingan']=[mentor2,'cb b cg l g pm ad'];
const mm=q=>{const ql=(q||'').toLowerCase(),l=users.filter(u=>canM(me,u)&&!mentOf(u.id)&&(!ql||(u.n+' '+u.k+' '+u.s).toLowerCase().includes(ql))).slice(0,15);return`<h3>Tambah anak dampingan</h3><p class="mut"><small>${me.r=='b'?'Penegak Bantara hanya dapat mendampingi Calon Bantara.':'Anda dapat mendampingi Calon Bantara dan Penegak Bantara.'} Maksimal 5 anak dampingan, sesama jenis kelamin.</small></p><div class="row"><input id="ms" value="${esc(q||'')}" placeholder="Cari nama, kelas, sangga" style="flex:1;margin:0"><button class="btn" data-act="ms">Cari</button></div>${l.map(u=>`<div class="card row" style="justify-content:space-between;margin:8px 0"><span>${esc(u.n)}<br><small class="mut">${ROLES[u.r]} · ${esc(u.k)}/${esc(u.s)}</small></span><button class="btn sm pri" data-act="ta" data-id="${u.id}">Tambah</button></div>`).join('')||`<p class="mut">Tidak ada peserta yang cocok.${me.g?'':' Jenis kelamin Anda belum diisi Admin.'}</p>`}`};

const amb=(u,h)=>{const im=g=>`<img src="${LOGO[g]}" alt="${AMB[g]}" style="height:${h}px;width:auto;object-fit:contain">`;return u.g&&!['pm','ad'].includes(u.r)?im(u.g):`<span class="row" style="gap:6px;flex-wrap:nowrap">${im('L')}${im('P')}</span>`},ambName=u=>u.g&&!['pm','ad'].includes(u.r)?`<br><small>${AMB[u.g]}</small>`:'<br><small>Ambalan Prabusiliwangi & Lenggang Kencana</small>';
const gsel=(id,g)=>`<label>Jenis kelamin (menentukan ambalan)</label><select id="${id}"><option value="">- belum diisi -</option><option value="L" ${g=='L'?'selected':''}>Putra (L) · Prabusiliwangi</option><option value="P" ${g=='P'?'selected':''}>Putri (P) · Lenggang Kencana</option></select>`;
acts.jk=()=>modal(`<h3>Atur jenis kelamin massal</h3><p class="mut"><small>Satu baris per orang: <b>username,L</b> atau <b>username,P</b></small></p><textarea id="jk_t" rows="8"></textarea><button class="btn pri" data-act="jk2">Terapkan</button>`);
acts.jk2=async()=>{const rows=(v('jk_t')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.split(',').map(y=>y.trim())).map(c=>({username:c[0],gender:c[1]}));if(!rows.length)return;close();let n=0;for(let i=0;i<rows.length;i+=200){const{data,error}=await sb.rpc('admin_set_gender_massal',{p_rows:rows.slice(i,i+200)});if(error){toast('Berhenti di baris '+(i+1)+': '+error.message);break}n+=data}await loadAll();render();toast(n+' peserta diperbarui.')};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState=='visible'&&ready&&!busy&&!$('#modal').classList.contains('on')&&!(quiz&&!quiz.res)){await loadAll();render()}});
addEventListener('hashchange',render);render();boot();
